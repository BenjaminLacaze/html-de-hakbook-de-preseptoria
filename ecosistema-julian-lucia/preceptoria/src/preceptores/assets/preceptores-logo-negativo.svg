<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" role="img" aria-label="ISFDyT N° 26 — Panel de Preceptores">
  <!-- Crest Isotipo -->
  <g transform="translate(6, 6)">
    <!-- Shield / Crest outline on dark -->
    <rect x="0" y="0" width="52" height="52" rx="10" fill="#0C1535"/>
    <rect x="1" y="1" width="50" height="50" rx="9" stroke="#AF9B63" stroke-width="1.5" stroke-opacity="0.9"/>
    
    <!-- Stylized Book & Geometric 26 Crest -->
    <path d="M12 36C17 33 22 34 26 37C30 34 35 33 40 36V18C35 15 30 16 26 19C22 16 17 15 12 18V36Z" fill="#FFFFFF" fill-opacity="0.12"/>
    <path d="M14 34C18 31.5 22 32.5 26 35V19C22 16.5 18 15.5 14 18V34Z" stroke="#AF9B63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M38 34C34 31.5 30 32.5 26 35V19C30 16.5 34 15.5 38 18V34Z" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Stylized '26' Academic Emblem -->
    <circle cx="26" cy="14" r="3.5" fill="#AF9B63"/>
    <path d="M26 35V42" stroke="#AF9B63" stroke-width="2" stroke-linecap="round"/>
    <path d="M20 42H32" stroke="#AF9B63" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography Block -->
  <g transform="translate(70, 14)">
    <!-- Institutional Name (White) -->
    <text x="0" y="16" font-family="'Outfit', sans-serif" font-weight="800" font-size="17" fill="#FFFFFF" letter-spacing="-0.02em">ISFDyT N° 26</text>
    
    <!-- Module Indicator (Gold Sand, part of logo) -->
    <text x="0" y="32" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" fill="#AF9B63" letter-spacing="0.14em">PANEL DE PRECEPTORES</text>
    
    <!-- Accent Line -->
    <rect x="0" y="38" width="42" height="2" fill="#3F78B6" rx="1"/>
  </g>
</svg>
